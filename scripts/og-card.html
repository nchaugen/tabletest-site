<!doctype html>
<!--
  Source of static/images/og-card.png — the 1200x630 social card that Slack, LinkedIn
  and X show when someone links to tabletest.org.

  Regenerate after editing (Playwright and macOS system fonts required):

    npx playwright screenshot --viewport-size=1200,630 --device-scale-factor=2 \
      scripts/og-card.html /tmp/og-card@2x.png
    sips -Z 1200 /tmp/og-card@2x.png --out static/images/og-card.png

  The card uses Charter and Avenir Next, which ship with macOS. Render on a Mac.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #F4F6F8;
    --card: #FFFFFF;
    --rule: #6C707E;
    --band: #EBECF0;
    --ink: #1A1F26;
    --muted: #6C707E;
    --pass: #2E7D5B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--paper);
    font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    padding: 30px;
  }
  .card {
    flex: 1;
    background: var(--card);
    border: 2px solid var(--rule);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* top band — the strip above the first rule in the TableTest glyph */
  .band {
    height: 84px;
    background: var(--band);
    border-bottom: 2px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 44px;
  }
  .mark { display: flex; align-items: center; gap: 14px; }
  .mark svg { display: block; }
  .wordmark {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .domain {
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .body { flex: 1; display: flex; flex-direction: column; padding: 40px 44px 30px; }

  h1 {
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 60px;
    line-height: 1.04;
    letter-spacing: -0.015em;
    font-weight: 700;
    color: var(--ink);
  }
  .sub {
    margin-top: 14px;
    font-size: 24px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.005em;
  }

  .snippet { margin-top: 40px; }
  .quote {
    font-family: Menlo, monospace;
    font-size: 19px;
    color: #A2A7B0;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .quote.close { margin-top: 14px; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0 0;
    table-layout: fixed;
  }
  th, td {
    border: 1.5px solid var(--rule);
    padding: 10px 20px;
    text-align: left;
  }
  th:first-child, td:first-child { border-left: 0; padding-left: 0; }
  th:last-child, td:last-child { border-right: 0; }
  thead th { border-top: 0; background: var(--band); }
  tbody tr:last-child td { border-bottom: 0; }
  th {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
  }
  td.scenario {
    font-family: Charter, Georgia, serif;
    font-size: 27px;
    color: var(--ink);
  }
  td.value {
    font-family: Menlo, monospace;
    font-size: 24px;
    color: var(--ink);
  }
  td.value.pass { color: var(--pass); }
  td.value.fail { color: var(--muted); }
  col.c1 { width: 54%; }
  col.c2 { width: 23%; }
  col.c3 { width: 23%; }
</style>
</head>
<body>
  <div class="card">
    <div class="band">
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 2.5H13C13.8284 2.5 14.5 3.17157 14.5 4V12C14.5 12.8284 13.8284 13.5 13 13.5H3C2.17157 13.5 1.5 12.8284 1.5 12V4C1.5 3.17157 2.17157 2.5 3 2.5Z" fill="#FFFFFF" stroke="#6C707E"/>
          <path d="M5.5 3V13" stroke="#6C707E"/>
          <path d="M10.5 3V13" stroke="#6C707E"/>
          <path d="M2 5.5H14" stroke="#6C707E"/>
        </svg>
        <span class="wordmark">TableTest</span>
      </div>
      <span class="domain">tabletest.org</span>
    </div>

    <div class="body">
      <h1>Turn test methods into rows</h1>
      <p class="sub">A JUnit extension for table-driven tests in Java and Kotlin.</p>

      <div class="snippet">
        <div class="quote">@TableTest("""</div>
        <table>
          <colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup>
          <thead>
            <tr><th>Scenario</th><th>Year</th><th>Leap?</th></tr>
          </thead>
          <tbody>
            <tr><td class="scenario">Divisible by 4</td><td class="value">2004</td><td class="value pass">true</td></tr>
            <tr><td class="scenario">Divisible by 100 but not by 400</td><td class="value">2100</td><td class="value fail">false</td></tr>
            <tr><td class="scenario">Divisible by 400</td><td class="value">2000</td><td class="value pass">true</td></tr>
          </tbody>
        </table>
        <div class="quote close">""")</div>
      </div>
    </div>
  </div>
</body>
</html>
