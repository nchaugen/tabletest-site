# Hugo configuration file
title: TableTest

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Learn
      pageRef: /learn
      weight: 1
    - name: Reference
      pageRef: /reference
      weight: 2
    - name: Specifications
      pageRef: /spec
      weight: 3
    - name: Tools
      pageRef: /tools
      weight: 4
    - name: Changelog
      pageRef: /changelog
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/nchaugen/tabletest"
      params:
        icon: github

params:
  description: >-
    A JUnit extension for table-driven tests in Java and Kotlin. Write the test method
    once, then add a row for each scenario. Same coverage. Less code.
  images:
    - images/og-card.png
  imageWidth: 1200
  imageHeight: 630
  imageAlt: >-
    A Java test method with a @TableTest table. The table has a Scenario, Year and Is
    Leap Year? column, and one row for each leap year rule.

  currentTableTestVersion: "1.2.2"
  currentJUnitVersion: "6.1.2"
  currentReporterVersion: "1.5.0"
  currentFormatterVersion: "1.1.2"
  currentIntelliJVersion: "0.4.2"
  currentVSCodeVersion: "0.1.1"
  currentClaudePluginVersion: "1.9.0"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/dataTables.svg
      dark: images/dataTables_dark.svg
      link: /
      width: 20
      height: 10

  banner:
    key: 'announcement-ttr-150'
    message: |
      🎉 [TableTest Reporter 1.5.0](https://github.com/nchaugen/tabletest-reporter/releases/tag/tabletest-reporter-1.5.0) is out! Read an HTML report from the keyboard, in a navigation tree that folds. Read the [changelog](/changelog/).

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/nchaugen/tabletest-site/edit/main/content"

outputs:
  home: [html, rss, llms]
  page: [html]
  section: [html, rss]
