# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Daily rebuild so the living specs track their product repos (they are
  # generated from the product test suites at build time, not stored here)
  schedule:
    - cron: '30 6 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history for .GitInfo and .Lastmod
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Verify examples
        working-directory: examples
        run: ./gradlew spotlessCheck test
      - name: Setup Java for living specs
        # tabletest-reporter-junit needs Java 21+; the examples above stay on 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Checkout tabletest-formatter
        uses: actions/checkout@v4
        with:
          repository: nchaugen/tabletest-formatter
          path: spec-sources/tabletest-formatter
      - name: Checkout tabletest-reporter
        uses: actions/checkout@v4
        with:
          repository: nchaugen/tabletest-reporter
          path: spec-sources/tabletest-reporter
      - name: Checkout tabletest
        uses: actions/checkout@v4
        with:
          repository: nchaugen/tabletest
          path: spec-sources/tabletest
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-spec-${{ hashFiles('spec-sources/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-spec-
      - name: Generate formatter living spec
        working-directory: spec-sources/tabletest-formatter
        run: >
          mvn -Preport -pl tabletest-formatter-core
          test org.tabletest:tabletest-reporter-maven-plugin:report
          --no-transfer-progress
      - name: Generate reporter living spec (self-hosted)
        working-directory: spec-sources/tabletest-reporter
        run: |
          mvn install -DskipTests --no-transfer-progress
          mvn -f tabletest-reporter-core -Preport test org.tabletest:tabletest-reporter-maven-plugin:report --no-transfer-progress
      - name: Generate core living docs
        working-directory: spec-sources/tabletest
        run: >
          mvn -Preport -pl tabletest-junit
          test org.tabletest:tabletest-reporter-maven-plugin:report
          --no-transfer-progress
      - name: Generate parser living spec
        # the parser is a module of the tabletest repo — same checkout as core
        working-directory: spec-sources/tabletest
        run: >
          mvn -Preport -pl tabletest-parser
          test org.tabletest:tabletest-reporter-maven-plugin:report
          --no-transfer-progress
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Add living specs
        run: |
          mkdir -p public/spec
          cp -r spec-sources/tabletest-formatter/tabletest-formatter-core/target/generated-docs/tabletest public/spec/formatter
          cp -r spec-sources/tabletest-reporter/tabletest-reporter-core/target/generated-docs/tabletest public/spec/reporter
          cp -r spec-sources/tabletest/tabletest-junit/target/generated-docs/tabletest public/spec/core
          cp -r spec-sources/tabletest/tabletest-parser/target/generated-docs/tabletest public/spec/parser
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
